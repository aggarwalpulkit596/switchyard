# Local development dependencies. See docs/engineering/local-dev.md.
name: switchyard

services:
  postgres:
    image: postgres:16.9
    environment:
      POSTGRES_USER: switchyard
      POSTGRES_PASSWORD: switchyard
      POSTGRES_DB: switchyard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchyard -d switchyard"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/temporal:1.9.1
    command:
      - server
      - start-dev
      - --ip=0.0.0.0
      - --db-filename=/home/temporal/temporal.db
    ports:
      - "127.0.0.1:7233:7233" # gRPC frontend
      - "127.0.0.1:8233:8233" # Web UI
    volumes:
      # Mounted on the image user's existing home dir so the volume inherits uid 1000 ownership.
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  temporal-data:
