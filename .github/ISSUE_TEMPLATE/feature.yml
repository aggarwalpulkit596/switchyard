name: Feature
description: A user-visible or system capability
labels: ["type:feature"]
body:
  - type: textarea
    id: why
    attributes: { label: Why, description: Problem and who it serves. Link RFC/ADR sections. }
    validations: { required: true }
  - type: textarea
    id: what
    attributes: { label: Scope, description: What is in and explicitly out. }
    validations: { required: true }
  - type: textarea
    id: ac
    attributes: { label: Acceptance criteria, description: Demonstrable, testable checklist., value: "- [ ] " }
    validations: { required: true }
  - type: textarea
    id: failure
    attributes: { label: Failure modes covered, description: F-numbers from docs/design/failure-modes.md }
  - type: textarea
    id: deps
    attributes: { label: Dependencies }
