name: Spike
description: Timeboxed investigation to answer a question before building
labels: ["type:spike"]
body:
  - type: textarea
    id: q
    attributes: { label: Question(s) }
    validations: { required: true }
  - type: input
    id: timebox
    attributes: { label: Timebox }
    validations: { required: true }
  - type: textarea
    id: evidence
    attributes: { label: Evidence required to answer }
  - type: textarea
    id: fallback
    attributes: { label: Fallback if the answer is no }
